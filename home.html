<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIF BOT V1 - Uptime Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447, #1b1b2f);
            color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #e43f5a;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #a7a9be;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            background-color: #2e8b57;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(46, 139, 87, 0.5);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ARIF BOT V1</h1>
        <p>Your Messenger Bot Uptime Server is running smoothly and successfully!</p>
        <div class="status-badge">● ONLINE & ACTIVE</div>
        <div class="footer">Powered by Ariful Islam Sabbir</div>
    </div>
</body>
</html>
